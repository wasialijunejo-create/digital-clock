<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Alarm / timer ringing banner -->
  <div class="ring" id="ring" role="alertdialog" aria-labelledby="ringTitle" aria-describedby="ringText" hidden>
    <div>
      <p class="ring-title" id="ringTitle"></p>
      <p class="ring-text" id="ringText"></p>
    </div>
    <div class="ring-actions">
      <button type="button" class="btn btn-ghost" id="snoozeBtn">Snooze 5 min</button>
      <button type="button" class="btn btn-primary" id="dismissBtn">Dismiss</button>
    </div>
  </div>

  <div class="shell">
    <!-- Top bar: brand + theme switcher + time format switcher -->
    <header class="topbar">
      <h1>Digital Clock</h1>
      <div class="controls">
        <div class="segmented" role="group" aria-label="Time format">
          <button type="button" data-format="12" aria-pressed="true">12h</button>
          <button type="button" data-format="24" aria-pressed="false">24h</button>
        </div>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch to light theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main class="dashboard">
      <!-- 1 + 2. Main clock and date -->
      <section class="card hero" aria-label="Current time">
        <div class="clock" id="clock" role="img" aria-label="Current time">
          <span class="digit" id="h1"></span><span class="digit" id="h2"></span>
          <span class="colon">:</span>
          <span class="digit" id="m1"></span><span class="digit" id="m2"></span>
          <span class="colon">:</span>
          <span class="digit seconds" id="s1"></span><span class="digit seconds" id="s2"></span>
          <span class="ampm" id="ampm"></span>
        </div>
        <div class="sec-track" aria-hidden="true"><div class="sec-fill" id="secFill"></div></div>
        <div class="date-row">
          <p class="weekday" id="weekday"></p>
          <p class="fulldate" id="fullDate"></p>
        </div>
        <p class="tz" id="tz"></p>
      </section>

      <!-- 3. Alarm -->
      <section class="card" aria-labelledby="alarmTitle">
        <h2 id="alarmTitle">Alarm</h2>
        <form class="alarm-form" id="alarmForm" novalidate>
          <div class="field-row">
            <label class="field">
              <span>Time</span>
              <input type="time" id="alarmTime" required>
            </label>
            <label class="field grow">
              <span>Label</span>
              <input type="text" id="alarmLabel" maxlength="30" placeholder="Optional">
            </label>
          </div>
          <label class="check"><input type="checkbox" id="alarmRepeat"> Repeat daily</label>
          <p class="form-error" id="alarmError" role="alert"></p>
          <div class="btn-row">
            <button type="submit" class="btn btn-primary">Add alarm</button>
            <button type="button" class="btn btn-ghost" id="testSound">Test sound</button>
          </div>
        </form>
        <p class="status" id="alarmStatus" aria-live="polite"></p>
        <p class="empty" id="alarmEmpty">No alarms yet. Choose a time and add your first alarm.</p>
        <ul class="alarm-list" id="alarmList"></ul>
      </section>

      <!-- 4. Stopwatch -->
      <section class="card" aria-labelledby="swTitle">
        <h2 id="swTitle">Stopwatch</h2>
        <p class="readout" id="swDisplay">00:00:00.00</p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="swStart">Start</button>
          <button type="button" class="btn btn-ghost" id="swStop">Stop</button>
          <button type="button" class="btn btn-ghost" id="swReset">Reset</button>
        </div>
      </section>

      <!-- 5. Countdown timer -->
      <section class="card" aria-labelledby="cdTitle">
        <h2 id="cdTitle">Countdown timer</h2>
        <p class="readout" id="cdDisplay">00:05:00</p>
        <div class="bar" aria-hidden="true"><div class="bar-fill" id="cdFill"></div></div>
        <div class="timer-inputs">
          <label class="field"><span>Hours</span><input type="number" id="cdH" min="0" max="99" step="1" inputmode="numeric" value="0"></label>
          <label class="field"><span>Minutes</span><input type="number" id="cdM" min="0" max="59" step="1" inputmode="numeric" value="5"></label>
          <label class="field"><span>Seconds</span><input type="number" id="cdS" min="0" max="59" step="1" inputmode="numeric" value="0"></label>
        </div>
        <div class="presets" role="group" aria-label="Quick presets">
          <button type="button" class="chip" data-preset="60">1 min</button>
          <button type="button" class="chip" data-preset="300">5 min</button>
          <button type="button" class="chip" data-preset="600">10 min</button>
          <button type="button" class="chip" data-preset="1800">30 min</button>
        </div>
        <p class="form-error" id="cdError" role="alert"></p>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" id="cdStart">Start</button>
          <button type="button" class="btn btn-ghost" id="cdReset">Reset</button>
        </div>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
